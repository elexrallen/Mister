# Redeploy manual de GitHub Pages usando el contenido actual del repo.
# El despliegue diario real ocurre dentro de daily_update.yml para publicar
# exactamente los archivos generados en ese mismo run.

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject refresh-config (optional secret)
        env:
          REFRESH_CONFIG_JSON: ${{ secrets.REFRESH_CONFIG_JSON }}
        run: |
          if [ -n "$REFRESH_CONFIG_JSON" ]; then
            printf '%s\n' "$REFRESH_CONFIG_JSON" > public/refresh-config.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
