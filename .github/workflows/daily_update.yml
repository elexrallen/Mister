# Actualización del dataset Mister Fantasy Advisor.
# Genera public/data/*.json y publica GitHub Pages en el mismo run.
# El commit histórico del snapshot pasa a ser best-effort y no bloquea el deploy.
#
# Disparos:
#   - cron cada 2 horas (minuto 30 UTC)
#   - workflow_dispatch (Actions UI)
#   - repository_dispatch type=refresh-data (botón PWA vía Cloudflare Worker)
#
# El minuto :30 evita coincidir con la rotación de Mister, que cierra el
# mercado en punto. Un solo cron UTC: la frecuencia no depende del DST.

name: Daily data update

on:
  schedule:
    # Cada 2 horas, minuto 30 UTC (00:30, 02:30, … 22:30).
    - cron: "30 */2 * * *"
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:
    inputs:
      league:
        description: "Liga a regenerar (all, slug o id_community)"
        required: true
        default: all
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Un toggle de reventa no comparte grupo con el cron: cancel-in-progress
  # del dataset no puede matar el job antes de commitear flip_mode.json.
  group: ${{ github.event.client_payload.flip_mode != null && format('flip-{0}', github.event.client_payload.league || 'league') || 'daily-data-update' }}
  cancel-in-progress: ${{ github.event.client_payload.flip_mode == null }}

jobs:
  update-data:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve league
        id: league
        run: |
          LEAGUE="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LEAGUE="${{ github.event.inputs.league }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            LEAGUE="${{ github.event.client_payload.league }}"
          fi
          if [ -z "$LEAGUE" ]; then
            LEAGUE="all"
          fi
          # Sin whitelist fija: discovery en runtime resuelve slugs/ids
          echo "league=$LEAGUE" >> "$GITHUB_OUTPUT"
          echo "Regenerando liga: $LEAGUE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply flip-mode toggle
        env:
          LEAGUE: ${{ steps.league.outputs.league }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from flip_mode import apply_flip_toggle, flip_mode_path

          league = os.environ.get("LEAGUE", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH") or ""
          payload = {}
          if event_path and Path(event_path).is_file():
              try:
                  event = json.loads(Path(event_path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  print(f"no se pudo leer el evento: {exc}")
                  event = {}
              raw_payload = event.get("client_payload") if isinstance(event, dict) else None
              if isinstance(raw_payload, dict):
                  payload = raw_payload
          print(f"league={league!r} client_payload={json.dumps(payload, ensure_ascii=False)}")
          if "flip_mode" not in payload:
              print("sin cambio de reventa")
              sys.exit(0)
          root = Path("public/data/leagues")
          wrote = apply_flip_toggle(league, payload.get("flip_mode"), root=root)
          print(f"ruta={flip_mode_path(league, root)}")
          if wrote:
              print("flip_mode escrito")
          else:
              print("::error::el payload trae flip_mode pero no se escribió (liga vacía, all o valor raro)")
              sys.exit(1)
          PY

      - name: Run data engine
        env:
          # Auth Mister (DevTools → POST /ajax/balance → Cookie + x-auth)
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_X_AUTH: ${{ secrets.MISTER_X_AUTH }}
          MISTER_PHPSESSID: ${{ secrets.MISTER_PHPSESSID }}
          MISTER_REFRESH_TOKEN: ${{ secrets.MISTER_REFRESH_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          MISTER_LEAGUE_ID: ${{ secrets.MISTER_LEAGUE_ID }}
          MISTER_TEAM_ID: ${{ secrets.MISTER_TEAM_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python src/data_engine.py --league "${{ steps.league.outputs.league }}"

      # Escribe en Mister. Solo actúa en las ligas dadas de alta en
      # config/automation.json y con el kill switch global en true. Va con
      # continue-on-error para que un rechazo de Mister no tumbe la publicación
      # del dataset, que es lo que se consulta aunque no se ejecute nada.
      - name: Automated cycle (per-league writes)
        id: automation
        continue-on-error: true
        env:
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_X_AUTH: ${{ secrets.MISTER_X_AUTH }}
          MISTER_PHPSESSID: ${{ secrets.MISTER_PHPSESSID }}
          MISTER_REFRESH_TOKEN: ${{ secrets.MISTER_REFRESH_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          # Freno de mano remoto: ponlo a 1 en las variables del repo para
          # apagar la escritura sin tocar config/automation.json.
          MISTER_AUTOMATION_OFF: ${{ vars.MISTER_AUTOMATION_OFF }}
        run: python src/auto_executor.py --league all

      # Tras actuar, la caja y la plantilla son otras: el payload publicado
      # quedaría describiendo un estado que ya no existe.
      - name: Refresh payload of leagues that acted
        if: ${{ steps.automation.outputs.acted != '' }}
        continue-on-error: true
        env:
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_X_AUTH: ${{ secrets.MISTER_X_AUTH }}
          MISTER_PHPSESSID: ${{ secrets.MISTER_PHPSESSID }}
          MISTER_REFRESH_TOKEN: ${{ secrets.MISTER_REFRESH_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          IFS=',' read -ra SLUGS <<< "${{ steps.automation.outputs.acted }}"
          for slug in "${SLUGS[@]}"; do
            [ -z "$slug" ] && continue
            echo "Regenerando $slug tras las operaciones del ciclo"
            python src/data_engine.py --league "$slug"
          done

      - name: Verify live data (not mock fallback)
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path("public/data/latest_data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          meta = (data.get("meta") or {}).get("live_meta") or {}
          source = str(meta.get("source") or "")
          has_secrets = bool(os.environ.get("MISTER_TOKEN") or os.environ.get("MISTER_COOKIE"))
          print(f"source={source!r} balance_ok={meta.get('balance_ok')} market_ok={meta.get('market_ok')}")
          idx = Path("public/data/leagues.json")
          if idx.is_file():
              leagues = json.loads(idx.read_text(encoding="utf-8"))
              print("leagues", [L.get("slug") for L in (leagues.get("leagues") or [])])
          if has_secrets and (not source or "mock" in source.lower() or meta.get("balance_ok") is False):
              print("::error::Secrets presentes pero el motor no obtuvo datos live de Mister.")
              print("Renueva MISTER_TOKEN + MISTER_X_AUTH (+ PHPSESSID) en Settings → Secrets.")
              sys.exit(1)
          if not has_secrets:
              print("::warning::Sin secrets de Mister → snapshot mock/demo. Configura secrets para datos reales.")
          PY
        env:
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}

      - name: Performance audit (xPts, once, mercado)
        continue-on-error: true
        run: python src/performance_audit.py --markdown --fail-on-gates

      - name: Inject refresh-config (optional secret)
        env:
          REFRESH_CONFIG_JSON: ${{ secrets.REFRESH_CONFIG_JSON }}
        run: |
          rm -f public/refresh-config.json
          if [ -n "$REFRESH_CONFIG_JSON" ]; then
            printf '%s\n' "$REFRESH_CONFIG_JSON" > public/refresh-config.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist snapshot history (best effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # leagues/ arrastra flip_mode.json y el automation_log.json de cada liga.
          git add public/data/latest_data.json public/data/leagues.json public/data/leagues/ || true
          git add public/data/leagues/*/flip_mode.json || true
          git add cache/rival_finances/ || true
          echo "flip_mode.json en el commit:"
          git diff --cached --name-only | grep flip_mode || echo "(ninguno)"
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update fantasy data snapshot"
            # Autostash: el motor ensucia cache/ (fichas, pools) que no van en este commit.
            # Sin eso, `pull --rebase` aborta con "You have unstaged changes".
            for i in 1 2 3; do
              git pull --rebase --autostash origin main
              if git push; then
                echo "Push OK"
                exit 0
              fi
              echo "Push rechazado (intento $i); reintento tras rebase..."
              sleep 3
            done
            echo "::error::No se pudo pushear el snapshot tras 3 intentos"
            exit 1
          fi
