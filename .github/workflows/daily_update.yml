# Actualización del dataset Mister Fantasy Advisor.
# Genera public/data/*.json + history/ y lo commitea.
# GitHub Pages (rama main → /public) se regenera tras el push.
#
# Disparos:
#   - cron diario
#   - workflow_dispatch (Actions UI)
#   - repository_dispatch type=refresh-data (botón PWA vía Cloudflare Worker)

name: Daily data update

on:
  schedule:
    # 06:00 UTC ≈ 08:00 CEST (mañana antes del mercado)
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:
    inputs:
      league:
        description: Liga a regenerar
        required: true
        default: all
        type: choice
        options:
          - all
          - laliga-patio
          - premier

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve league
        id: league
        run: |
          LEAGUE="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LEAGUE="${{ github.event.inputs.league }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            LEAGUE="${{ github.event.client_payload.league }}"
          fi
          if [ -z "$LEAGUE" ]; then
            LEAGUE="all"
          fi
          case "$LEAGUE" in
            all|laliga-patio|premier) ;;
            *)
              echo "Liga desconocida '$LEAGUE' → all"
              LEAGUE="all"
              ;;
          esac
          echo "league=$LEAGUE" >> "$GITHUB_OUTPUT"
          echo "Regenerando liga: $LEAGUE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data engine
        env:
          # Auth Mister (DevTools → POST /ajax/balance → Cookie + x-auth)
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_X_AUTH: ${{ secrets.MISTER_X_AUTH }}
          MISTER_PHPSESSID: ${{ secrets.MISTER_PHPSESSID }}
          MISTER_REFRESH_TOKEN: ${{ secrets.MISTER_REFRESH_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          MISTER_LEAGUE_ID: ${{ secrets.MISTER_LEAGUE_ID }}
          MISTER_TEAM_ID: ${{ secrets.MISTER_TEAM_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python src/data_engine.py --league "${{ steps.league.outputs.league }}"

      - name: Verify live data (not mock fallback)
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path("public/data/latest_data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          meta = (data.get("meta") or {}).get("live_meta") or {}
          source = str(meta.get("source") or "")
          has_secrets = bool(os.environ.get("MISTER_TOKEN") or os.environ.get("MISTER_COOKIE"))
          print(f"source={source!r} balance_ok={meta.get('balance_ok')} market_ok={meta.get('market_ok')}")
          idx = Path("public/data/leagues.json")
          if idx.is_file():
              leagues = json.loads(idx.read_text(encoding="utf-8"))
              print("leagues", [L.get("slug") for L in (leagues.get("leagues") or [])])
          if has_secrets and (not source or "mock" in source.lower() or meta.get("balance_ok") is False):
              print("::error::Secrets presentes pero el motor no obtuvo datos live de Mister.")
              print("Renueva MISTER_TOKEN + MISTER_X_AUTH (+ PHPSESSID) en Settings → Secrets.")
              sys.exit(1)
          if not has_secrets:
              print("::warning::Sin secrets de Mister → snapshot mock/demo. Configura secrets para datos reales.")
          PY
        env:
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}

      - name: Commit updated JSON (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest_data.json public/data/history/ public/data/leagues.json public/data/leagues/ || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update fantasy data snapshot"
            # main puede haber avanzado (otro commit / deploy) mientras corría el job
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                echo "Push OK"
                exit 0
              fi
              echo "Push rechazado (intento $i); reintento tras rebase..."
              sleep 3
            done
            echo "::error::No se pudo pushear el snapshot tras 3 intentos"
            exit 1
          fi
