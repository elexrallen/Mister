# Actualización del dataset Mister Fantasy Advisor.
# Genera public/data/*.json y publica GitHub Pages en el mismo run.
# El commit histórico del snapshot pasa a ser best-effort y no bloquea el deploy.
#
# Disparos:
#   - cron ~30 min después de cada ciclo Mister (5 / 13 / 21 hora España)
#   - workflow_dispatch (Actions UI)
#   - repository_dispatch type=refresh-data (botón PWA vía Cloudflare Worker)
#
# GitHub Cron es UTC y no entiende DST. Se programan las 6 horas candidatas
# (verano 03:30/11:30/19:30 UTC, invierno 04:30/12:30/20:30 UTC) y un guard
# Europe/Madrid descarta la pareja que no toca.

name: Daily data update

on:
  schedule:
    # 05:30 / 13:30 / 21:30 Europe/Madrid (verano = UTC+2, invierno = UTC+1)
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    - cron: "30 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:
    inputs:
      league:
        description: "Liga a regenerar (all, slug o id_community)"
        required: true
        default: all
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-data-update
  cancel-in-progress: true

jobs:
  update-data:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cycle window guard (Europe/Madrid)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("src").resolve()))
          from market_cycle import should_run_cycle_refresh
          result = should_run_cycle_refresh()
          print(result)
          run = "true" if result.get("run") else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={run}\n")
          if run != "true":
              print("Fuera de la ventana 05:30/13:30/21:30 Europe/Madrid; se omite este cron.")
          PY

      - name: Resolve league
        id: league
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        run: |
          LEAGUE="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LEAGUE="${{ github.event.inputs.league }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            LEAGUE="${{ github.event.client_payload.league }}"
          fi
          if [ -z "$LEAGUE" ]; then
            LEAGUE="all"
          fi
          # Sin whitelist fija: discovery en runtime resuelve slugs/ids
          echo "league=$LEAGUE" >> "$GITHUB_OUTPUT"
          echo "Regenerando liga: $LEAGUE"

      - name: Setup Python
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        run: pip install -r requirements.txt

      - name: Run data engine
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        env:
          # Auth Mister (DevTools → POST /ajax/balance → Cookie + x-auth)
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_X_AUTH: ${{ secrets.MISTER_X_AUTH }}
          MISTER_PHPSESSID: ${{ secrets.MISTER_PHPSESSID }}
          MISTER_REFRESH_TOKEN: ${{ secrets.MISTER_REFRESH_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          MISTER_LEAGUE_ID: ${{ secrets.MISTER_LEAGUE_ID }}
          MISTER_TEAM_ID: ${{ secrets.MISTER_TEAM_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python src/data_engine.py --league "${{ steps.league.outputs.league }}"

      - name: Verify live data (not mock fallback)
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path("public/data/latest_data.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          meta = (data.get("meta") or {}).get("live_meta") or {}
          source = str(meta.get("source") or "")
          has_secrets = bool(os.environ.get("MISTER_TOKEN") or os.environ.get("MISTER_COOKIE"))
          print(f"source={source!r} balance_ok={meta.get('balance_ok')} market_ok={meta.get('market_ok')}")
          idx = Path("public/data/leagues.json")
          if idx.is_file():
              leagues = json.loads(idx.read_text(encoding="utf-8"))
              print("leagues", [L.get("slug") for L in (leagues.get("leagues") or [])])
          if has_secrets and (not source or "mock" in source.lower() or meta.get("balance_ok") is False):
              print("::error::Secrets presentes pero el motor no obtuvo datos live de Mister.")
              print("Renueva MISTER_TOKEN + MISTER_X_AUTH (+ PHPSESSID) en Settings → Secrets.")
              sys.exit(1)
          if not has_secrets:
              print("::warning::Sin secrets de Mister → snapshot mock/demo. Configura secrets para datos reales.")
          PY
        env:
          MISTER_TOKEN: ${{ secrets.MISTER_TOKEN }}
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}

      - name: Performance audit (xPts, once, mercado)
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        continue-on-error: true
        run: python src/performance_audit.py --markdown --fail-on-gates

      - name: Inject refresh-config (optional secret)
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        env:
          REFRESH_CONFIG_JSON: ${{ secrets.REFRESH_CONFIG_JSON }}
        run: |
          rm -f public/refresh-config.json
          if [ -n "$REFRESH_CONFIG_JSON" ]; then
            printf '%s\n' "$REFRESH_CONFIG_JSON" > public/refresh-config.json
          fi

      - name: Configure Pages
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist snapshot history (best effort)
        if: ${{ github.event_name != 'schedule' || steps.guard.outputs.run == 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest_data.json public/data/leagues.json public/data/leagues/ || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update fantasy data snapshot"
            # La publicación ya ha terminado; este push solo conserva histórico.
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                echo "Push OK"
                exit 0
              fi
              echo "Push rechazado (intento $i); reintento tras rebase..."
              sleep 3
            done
            echo "::error::No se pudo pushear el snapshot tras 3 intentos"
            exit 1
          fi
