name = "mister-refresh"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Reloj real de la actualización: GitHub Actions se salta la mayoría de los
# schedule. Esto dispara repository_dispatch cada 2 horas (minuto 15 UTC).
[triggers]
crons = ["15 */2 * * *"]

# Opcional: fija el repo aquí o con `wrangler secret put GITHUB_REPO`
# [vars]
# GITHUB_REPO = "elexrallen/Mister"
